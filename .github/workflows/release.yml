name: Release APK

# Builds the Android debug APK from source and attaches it to a GitHub Release whenever a
# v* tag is pushed (or when run manually). The download link in the app and README points at
# `releases/latest/download/openplex.apk`, so every tagged release refreshes it automatically.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk openplex.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: openplex.apk
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
